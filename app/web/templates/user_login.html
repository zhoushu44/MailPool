{% extends "base_customer.html" %}
{% block title %}登录{% endblock %}
{% block content %}
{# 登录页复刻 MailNest：整屏居中 + 单张卡片（rounded-xl + 细边框 + 轻阴影） #}
<div class="auth-shell">
    <div class="auth-card">
        <div class="auth-brand">
            <img src="/static/img/logo.svg" alt="MailPool" class="auth-logo">
        </div>

        <div class="auth-head">
            <h1 class="auth-title">登录</h1>
            <p class="auth-sub">请在下方输入您的用户名和密码登录你的账户</p>
            <p class="auth-alt">没有账户？<a href="/app/register">注册</a></p>
        </div>

        {% if error %}
        <div class="auth-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="/app/login" class="auth-form">
            <div class="auth-field">
                <label for="username">用户名</label>
                <input id="username" name="username" type="text" autocomplete="username"
                       value="{{ username or '' }}" required autofocus>
            </div>

            <div class="auth-field">
                <label for="password">密码</label>
                <div class="auth-pw">
                    <input id="password" name="password" type="password"
                           autocomplete="current-password" required>
                    <button type="button" class="auth-pw-toggle" onclick="togglePw()" tabindex="-1">显示</button>
                </div>
            </div>

            <button type="submit" class="auth-submit">登录</button>
        </form>

        <div class="auth-foot">
            点击登录即表示您同意我们的服务条款和隐私政策
        </div>
    </div>
</div>

<style>
.auth-shell {
    display: grid;
    place-items: center;
    min-height: calc(100vh - 260px);
    padding: 32px 16px;
}
.auth-card {
    width: 100%;
    max-width: 380px;                 /* MailNest: max-w-sm */
    background: #fff;
    border: 1px solid rgba(226, 232, 240, .7);
    border-radius: var(--nest-radius-xl, 14px);
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
    padding: 26px 24px 22px;
}
.auth-brand {
    display: flex;
    justify-content: center;
    margin-bottom: 18px;
}
.auth-logo { width: 34px; height: 34px; }
.auth-head { text-align: center; margin-bottom: 22px; }
.auth-title {
    font-size: 19px;
    font-weight: 650;
    letter-spacing: -0.02em;
    color: var(--nest-foreground, #0f172a);
    margin: 0 0 6px;
}
.auth-sub {
    font-size: 13px;
    color: var(--nest-muted-foreground, #64748b);
    margin: 0;
    line-height: 1.5;
}
.auth-alt {
    font-size: 12.5px;
    color: var(--nest-muted-foreground, #64748b);
    margin: 8px 0 0;
}
.auth-alt a {
    color: #2563eb;
    font-weight: 500;
    text-decoration: none;
}
.auth-alt a:hover { text-decoration: underline; }
.auth-error {
    background: rgba(239, 68, 68, .08);
    border: 1px solid rgba(239, 68, 68, .2);
    color: #b91c1c;
    border-radius: var(--nest-radius, 10px);
    padding: 9px 12px;
    font-size: 13px;
    margin-bottom: 16px;
    text-align: center;
}
.auth-form { display: grid; gap: 14px; }
.auth-field { display: grid; gap: 6px; }
.auth-field label {
    font-size: 13px;
    font-weight: 500;
    color: var(--nest-foreground, #0f172a);
}
.auth-field input {
    width: 100%;
    height: 38px;
    box-sizing: border-box;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 0 12px;
    font-size: 14px;
    background: #fff;
    transition: border-color .15s, box-shadow .15s;
}
.auth-field input:focus {
    outline: none;
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, .12);
}
.auth-pw { position: relative; }
.auth-pw input { padding-right: 56px; }
.auth-pw-toggle {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    height: 30px;
    padding: 0 10px;
    border: none;
    background: transparent;
    color: var(--nest-muted-foreground, #64748b);
    font-size: 12px;
    cursor: pointer;
    border-radius: 6px;
}
.auth-pw-toggle:hover { background: #f1f5f9; }
.auth-submit {
    width: 100%;
    height: 38px;
    margin-top: 4px;
    border: none;
    border-radius: 8px;
    background: var(--nest-foreground, #0f172a);
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity .15s;
}
.auth-submit:hover { opacity: .9; }
.auth-foot {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid rgba(226, 232, 240, .7);
    text-align: center;
    font-size: 11.5px;
    color: var(--nest-muted-foreground, #64748b);
    line-height: 1.5;
}
@media (max-width: 860px) {
    .auth-shell { min-height: auto; padding: 20px 0 40px; }
    .auth-card { padding: 22px 18px 18px; }
}
</style>

<script>
function togglePw() {
    const i = document.getElementById('password');
    const b = document.querySelector('.auth-pw-toggle');
    if (i.type === 'password') { i.type = 'text'; b.textContent = '隐藏'; }
    else { i.type = 'password'; b.textContent = '显示'; }
}
</script>
{% endblock %}
