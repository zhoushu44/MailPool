<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · MailPool</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="login-wrap">
    <div class="login-card">
        <div class="login-brand"><img class="brand-mark" src="/static/img/logo.svg" alt="MailPool"><div>MailPool<span class="brand-sub">邮箱接收平台</span></div></div>
        <h1>登录</h1>
        <p>请在下方输入管理口令以进入后台</p>
        {% if error %}<div class="login-error">{{ error }}</div>{% endif %}
        {% if not has_password %}
        <div class="login-error">未设置管理口令（MAILPOOL_ADMIN_PASSWORD）。<br>当前后台免密，可直接进入。</div>
        <a href="/" class="btn">进入后台</a>
        {% else %}
        <form method="post" action="/login">
            <label>管理口令</label>
            <input type="password" name="password" placeholder="输入口令" autofocus required>
            <button type="submit" class="btn">登录</button>
        </form>
        {% endif %}
    </div>
</div>
</body>
</html>
