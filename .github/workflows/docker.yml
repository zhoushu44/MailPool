name: Rust CI

# ---------------------------------------------------------------------------
# MailPool 现在是 Rust 版。这个 workflow 只做三件事：
#   1. cargo test（单元测试，182 个）
#   2. 构建 rust/Dockerfile（验证镜像能构建出来）
#   3. 推送到 Docker Hub 归档（不部署）
#
# ⚠️ **故意没有 deploy job**
#
# 原来是「push 后自动 SSH 到服务器跑 deploy/update.sh」，那条路径现在会
# 造成生产事故：
#   - 根 Dockerfile 是 Python 版（uvicorn）
#   - update.sh 拉的是 zhoushu1/mailpool:1.0（Python 镜像）
#   - 生产实际跑的是 mailpool-rust:*
#   → 一旦触发就把 Rust 换回 Python，而且没人会注意到
#
# 部署改为手动、显式：
#   本地  git push server main --tags
#   服务器 cd /opt/mailpool-src && bash deploy/build-rust.sh
#
# 这样"代码进仓库"和"改动生产"是两件事，不会被一次 push 意外连坐。
# ---------------------------------------------------------------------------
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  IMAGE_NAME: mailpool-rust

jobs:
  # =========================================================================
  # Job 1: 单元测试
  # =========================================================================
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # imap -> native-tls -> openssl-sys 需要头文件
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Run tests
        working-directory: rust
        run: cargo test --all-targets

  # =========================================================================
  # Job 2: 构建并推送镜像（仅归档，不部署）
  # =========================================================================
  build-and-push:
    name: Build & Push
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 镜像标签：3.2.1 / latest / sha-xxxxxxx
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}
          # 版本号不硬编码，避免和 git tag 漂移：
          #   push tag v3.2.1 → 生成 3.2.1
          #   推 main        → latest + sha-xxxxxxx
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # 构建上下文必须是仓库根：Dockerfile 里引用 rust/... 和 app/web/...
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./rust/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "## 🦀 Rust 镜像构建完成"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 事件 | \`${{ github.event_name }}\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 标签 | \`${{ steps.meta.outputs.tags }}\` |"
            echo "| 部署 | **未自动部署**（生产由 deploy/build-rust.sh 手动切换） |"
            echo ""
            if [ "${{ github.event_name }}" != "pull_request" ]; then
              echo "### 已推送标签"
              echo '```'
              echo "${{ steps.meta.outputs.tags }}"
              echo '```'
            else
              echo "> PR 仅验证构建，未推送。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
